<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img"><title>Типы в одном шаге машины</title><desc>Вход и данные машины уходят стороне запросом, сторона отвечает вариантом, строка перехода меняет данные и пишет журнал</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="30" width="170" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="125.0" y="48" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Вход</text><text x="125.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">запись полей входа</text><text x="125.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">ЗапросАгента</text><rect x="255" y="30" width="170" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="48" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Данные</text><text x="340.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">число&gt;=0, ?T, набор</text><text x="340.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">не убывает, пишет</text><rect x="470" y="30" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="555.0" y="48" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Запрос стороне</text><text x="555.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">таблица «Запрос»</text><text x="555.0" y="84" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">поля: ход, расход</text><rect x="470" y="180" width="170" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="555.0" y="198" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Сторона</text><text x="555.0" y="218" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">agent, human, machine</text><text x="555.0" y="234" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">вратарь, enhanced</text><rect x="255" y="180" width="170" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="198" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Ответ</text><text x="340.0" y="218" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">вариант ИтогХода</text><text x="340.0" y="234" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">или ИсходВорот</text><rect x="40" y="180" width="170" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="125.0" y="198" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Строка перехода</text><text x="125.0" y="218" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">образец Вар { … }</text><text x="125.0" y="234" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">условие, действия</text><rect x="40" y="330" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="348" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Журнал</text><text x="340.0" y="368" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">СобытиеЖурнала: код и параметры (строка, строка)</text><path d="M210 66 L253 66" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M425 66 L468 66" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M555 102 L555 178" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M470 216 L427 216" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M255 216 L212 216" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M125 252 L125 328" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M125 180 L125 141 L340 141 L340 104" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="348" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">поле = выр</text><circle cx="72" cy="420" r="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="1"/><text x="86" y="420" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">данные</text><circle cx="172" cy="420" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/><text x="186" y="420" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">обмен со стороной</text><circle cx="332" cy="420" r="6" fill="#F0997B" stroke="#993C1D" stroke-width="1"/><text x="346" y="420" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">исполнение</text></svg>