<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img"><title>Из чего состоит машина</title><desc>Машина на Алуле: что хранит, как ходит, с кем говорит; снаружи хозяин, журнал и сценарий</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="20" width="640" height="300" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Машина (файл на Алуле)</text><text x="130" y="66" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F6E56">Что хранит</text><rect x="40" y="80" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="130.0" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Типы</text><text x="130.0" y="114" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">формы данных</text><rect x="40" y="158" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="130.0" y="174" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Данные</text><text x="130.0" y="192" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">память машины</text><rect x="40" y="236" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="130.0" y="252" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Вход</text><text x="130.0" y="270" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">что дали при старте</text><text x="335" y="66" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#534AB7">Как ходит</text><rect x="245" y="80" width="180" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="335.0" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Состояния</text><text x="335.0" y="114" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">ждёт, делает, решает</text><rect x="245" y="158" width="180" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="335.0" y="174" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Переходы</text><text x="335.0" y="192" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">событие → действия</text><rect x="245" y="236" width="180" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="335.0" y="252" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Функции</text><text x="335.0" y="270" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">чистые вычисления</text><text x="540" y="66" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#993C1D">С кем говорит</text><rect x="450" y="80" width="180" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="540.0" y="96" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Стороны</text><text x="540.0" y="114" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">агент, человек, машина</text><rect x="450" y="158" width="180" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="540.0" y="174" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Ворота</text><text x="540.0" y="192" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">человек решает</text><rect x="450" y="236" width="180" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="540.0" y="252" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Фрагмент</text><text x="540.0" y="270" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">готовый кусок, Пауза</text><rect x="30" y="370" width="195" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="127.5" y="386" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">Хозяин</text><text x="127.5" y="404" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#854F0B">примитивы: читать, писать</text><rect x="250" y="370" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340.0" y="386" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Журнал</text><text x="340.0" y="404" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">след каждого шага</text><rect x="460" y="370" width="180" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="550.0" y="386" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Сценарий</text><text x="550.0" y="404" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">проверка по журналу</text><path d="M130 320 L130 368" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M340 320 L340 368" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M550 370 L550 322" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/></svg>