<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img"><title>Как работает Алула</title><desc>Файл машины переводится в дерево JSON, интерпретатор исполняет дерево, журнал сверяется со сценарием</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="30" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="125.0" y="50" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Файл машины</text><text x="125.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">.alula.md, ru или en</text><rect x="255" y="30" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340.0" y="50" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Переводчик</text><text x="340.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">разбор и проверки</text><rect x="470" y="30" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="555.0" y="50" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Дерево JSON</text><text x="555.0" y="68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">machine/2</text><line x1="210" y1="58" x2="253" y2="58" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="425" y1="58" x2="468" y2="58" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M555 86 L555 128 L340 128 L340 168" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="40" y="170" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="125.0" y="190" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Сценарий</text><text x="125.0" y="208" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">scenario/0</text><rect x="255" y="170" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="340.0" y="190" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Интерпретатор</text><text x="340.0" y="208" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">стороны и примитивы</text><rect x="470" y="170" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="555.0" y="190" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Журнал</text><text x="555.0" y="208" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">события и данные</text><line x1="210" y1="198" x2="253" y2="198" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="425" y1="198" x2="468" y2="198" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="125" y1="226" x2="125" y2="288" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="555" y1="226" x2="555" y2="288" stroke="#888780" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="40" y="290" width="600" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="307" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Сверка</text><text x="340" y="325" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">журнал совпал с тем, что ждёт сценарий</text><circle cx="72" cy="378" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="1"/><text x="86" y="378" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">запись</text><circle cx="172" cy="378" r="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="1"/><text x="186" y="378" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">данные</text><circle cx="272" cy="378" r="6" fill="#F0997B" stroke="#993C1D" stroke-width="1"/><text x="286" y="378" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#888780">исполнение</text></svg>
