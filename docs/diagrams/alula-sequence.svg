<svg width="680" viewBox="0 0 680 1090" role="img" xmlns="http://www.w3.org/2000/svg" height="1090"><title>Как исполняется машина: вызовы и возвраты по шагам</title><desc>Вызывающий запускает исполнителя; исполнитель по очереди вызывает хранилище и таблицы машины и получает ответ на каждый вызов; запрос стороне передаёт управление наружу, ответ стороны возвращает его; в конце исполнитель отвечает вызывающему</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect x="10" y="12" width="120" height="44" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="70" y="28" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Вызывающий</text><text x="70" y="45" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">хозяин, родитель</text></g><line x1="70" y1="56" x2="70" y2="1076" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><g><rect x="145" y="12" width="120" height="44" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/><text x="205" y="28" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Исполнитель</text><text x="205" y="45" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">интерпретатор</text></g><line x1="205" y1="56" x2="205" y2="1076" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><g><rect x="280" y="12" width="120" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text x="340" y="28" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Машина</text><text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">таблицы файла</text></g><line x1="340" y1="56" x2="340" y2="1076" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><g><rect x="415" y="12" width="120" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text x="475" y="28" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Состояние</text><text x="475" y="45" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">хранилище</text></g><line x1="475" y1="56" x2="475" y2="1076" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><g><rect x="550" y="12" width="120" height="44" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#854F0B"/><text x="610" y="28" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">Сторона</text><text x="610" y="45" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#854F0B">агент, человек</text></g><line x1="610" y1="56" x2="610" y2="1076" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><rect x="65" y="90" width="10" height="12" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/><rect x="200" y="90" width="10" height="348" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="470" y="138" width="10" height="44" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="335" y="244" width="10" height="44" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="470" y="320" width="10" height="44" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><rect x="605" y="426" width="10" height="90" fill="#FAC775" stroke="#854F0B" stroke-width="0