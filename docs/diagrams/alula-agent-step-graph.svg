<svg width="680" viewBox="0 0 680 690" role="img" xmlns="http://www.w3.org/2000/svg" height="690"><title>Машина «Шаг агента» на Алуле</title><desc>Один ход агента: старт, обращение к агенту, развилки проверки, повтора, политики и бюджета, обращение к человеку, учёт, итог шага и два конца</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect x="40" y="30" width="140" height="48" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text x="110.0" y="47" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">СТАРТ</text><text x="110.0" y="65" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">берёт время</text></g><g><rect x="270" y="30" width="140" height="48" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/><text x="340.0" y="47" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">ХОД_АГЕНТА</text><text x="340.0" y="65" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">спрашивает агента</text></g><g><rect x="514" y="30" width="140" height="48" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#854F0B"/><text x="584.0" y="47" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">Агент</text><text x="584.0" y="65" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#854F0B">модель отвечает</text></g><line x1="180" y1="54" x2="268" y2="54" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="410" y1="54" x2="512" y2="54" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><path d="M340 78 L340 107" fill="none" stroke="#888780" stroke-width="1.5"/><path d="M110 107 L584 107" fill="none" stroke="#888780" stroke-width="1.5"/><g><rect x="40" y="138" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="110.0" y="155" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">ПРОВЕРКА_ОТВЕТА</text><text x="110.0" y="173" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">форма ответа</text></g><g><rect x="198" y="138" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="268.0" y="155" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">ПРОДОЛЖЕНИЕ</text><text x="268.0" y="173" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">ответ обрезан</text></g><g><rect x="356" y="138" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="426.0" y="155" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">ПОВТОР</text><text x="426.0" y="173" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">временная ошибка</text></g><g><rect x="514" y="138" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="584.0" y="155" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">ПОЛИТИКА</text><text x="584.0" y="173" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">нужно разрешение</text></g><line x1="110" y1="107" x2="110" y2="136" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="268" y1="107" x2="268" y2="136" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="426" y1="107" x2="426" y2="136" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="584" y1="107" x2="584" y2="136" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="110" y1="186" x2="110" y2="214" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="268" y1="186" x2="268" y2="214" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="426" y1="186" x2="426" y2="214" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="545" y1="186" x2="545" y2="214" stroke="#888780" stroke-width="1.5" fill="none"/><path d="M110 214 L545 214" fill="none" stroke="#888780" stroke-width="1.5"/><line x1="340" y1="214" x2="340" y2="248" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><g><rect x="270" y="250" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">БЮДЖЕТ</text><text x="340.0" y="285" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">хватает пределов?</text></g><g><rect x="514" y="250" width="140" height="48" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/><text x="584.0" y="267" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">РАЗРЕШЕНИЕ</text><text x="584.0" y="285" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#534AB7">спрашивает вратаря</text></g><line x1="584" y1="186" x2="584" y2="248" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="514" y1="274" x2="412" y2="274" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><path d="M270 274 L20 274 L20 12 L340 12 L340 28" fill="none" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5"/><text x="146" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">следующий ход</text><g><rect x="514" y="340" width="140" height="48" rx="8" stroke-width="0.5" fill="#FAEEDA" stroke="#854F0B"/><text x="584.0" y="357" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">Вратарь</text><text x="584.0" y="375" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#854F0B">человек или агент</text></g><line x1="584" y1="298" x2="584" y2="338" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><g><rect x="270" y="340" width="140" height="48" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text x="340.0" y="357" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">УЧЁТ</text><text x="340.0" y="375" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0F6E56">считает расход</text></g><line x1="340" y1="298" x2="340" y2="338" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><path d="M40 170 L30 170 L30 370 L268 370" stroke-dasharray="5 4" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><text x="42" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">в УЧЁТ: ХОД_АГЕНТА 3–5, 7, 9;</text><text x="42" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">ПОВТОР 3; ПРОДОЛЖЕНИЕ 2;</text><text x="42" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">ПРОВЕРКА_ОТВЕТА 1, 2, 4</text><g><rect x="270" y="420" width="140" height="48" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/><text x="340.0" y="437" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">ИТОГ_ШАГА</text><text x="340.0" y="455" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">остановка пуста?</text></g><line x1="340" y1="388" x2="340" y2="418" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><path d="M340 468 L340 494" fill="none" stroke="#888780" stroke-width="1.5"/><path d="M260 494 L420 494" fill="none" stroke="#888780" stroke-width="1.5"/><line x1="260" y1="494" x2="260" y2="518" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><line x1="420" y1="494" x2="420" y2="518" marker-end="url(#arrow)" stroke="#888780" stroke-width="1.5" fill="none"/><g><rect x="190" y="520" width="140" height="48" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/><text x="260.0" y="537" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">КОНЕЦ</text><text x="260.0" y="555" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">Ответ(…)</text></g><g><rect x="350" y="520" width="140" height="48" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/><text x="420.0" y="537" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">ОСТАНОВЛЕНО</text><text x="420.0" y="555" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#993C1D">Отказ(код, текст)</text></g><circle cx="46" cy="602" r="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="58" y="602" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">операция: делает работу</text><circle cx="246" cy="602" r="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text x="258" y="602" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">обращение: ждёт сторону</text><circle cx="456" cy="602" r="6" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/><text x="468" y="602" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">развилка: решает по данным</text><circle cx="46" cy="626" r="6" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="58" y="626" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">конец: отдаёт ответ</text><circle cx="246" cy="626" r="6" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/><text x="258" y="626" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">сторона: агент или человек</text><text x="40" y="656" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A">Не показаны: строки «иначе» развилок (→ ОШИБКА) и ПАУЗА из фрагмента «Пауза».</text></svg>
