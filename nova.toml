# nova.toml - alula: the core of the language of state machines written as data (the machine tree, the checks, the translator of
# the tables, the engine, the interpreter, nested machines, the program `alula` and the scenarios).
#
# Layout: ALL `.nv` UNDER `src/`; a module in a folder is `alula.<folder>` and one folder is one module and one unit of tests under
# Oracle 0.1.0. Tests are peer files `*_test.nv` beside the sources. Build: Nova Oracle 0.1.0, Clang, see `spikes/env/README.md`.
#
# No dependencies: the package uses `std` only (`std.io`, `std.os`, `std.fs` only in `src/alula_cli/` and `src/alula.nv`).

[lib]
src = "src"

[package]
name = "alula"
version = "0.7.0"
description = "The core of the language of state machines written as data: tree, checks, translator of tables, engine, interpreter, scenarios"
license = "MIT OR Apache-2.0"

# [[bin]] is declared by the spec but not read by Oracle 0.1.0; kept as the single record of the entry point.
# Build it with an explicit path: `nova build src/alula.nv -o target/alula.exe`.
[[bin]]
name = "alula"
path = "src/alula.nv"
